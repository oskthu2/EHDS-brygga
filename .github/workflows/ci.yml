name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build bridge (Maven)
        working-directory: bridge
        run: mvn package -DskipTests --no-transfer-progress

      - name: Lint mock services (Node.js)
        run: |
          for dir in mocks/tak mocks/ei mocks/sparr mocks/logg mocks/backend; do
            echo "-> $dir"
            npm ci --prefix $dir --silent
          done

      - name: Build Docker images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for bridge (Java startup ~30s)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/metadata > /dev/null 2>&1; then
              echo "Bridge is up after ${i}0s"
              break
            fi
            sleep 10
          done

      - name: Run integration tests
        continue-on-error: true
        run: bash scripts/test.sh
        env:
          GATEWAY_URL: http://localhost:8080

      - name: Stop stack
        if: always()
        run: docker compose down
