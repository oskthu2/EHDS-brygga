name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            bridge/package-lock.json
            mocks/tak/package-lock.json
            mocks/ei/package-lock.json
            mocks/sparr/package-lock.json
            mocks/logg/package-lock.json
            mocks/backend/package-lock.json

      - name: Install and lint bridge
        working-directory: bridge
        run: |
          npm ci
          npm run lint --if-present

      - name: Install mock dependencies
        run: |
          for dir in mocks/tak mocks/ei mocks/sparr mocks/logg mocks/backend; do
            echo "-> $dir"
            npm ci --prefix $dir
          done

      - name: Build Docker images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for services
        run: sleep 10

      - name: Run integration tests
        run: bash scripts/test.sh
        env:
          GATEWAY_URL: http://localhost:8080

      - name: Stop stack
        if: always()
        run: docker compose down
