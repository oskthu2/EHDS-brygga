name: Build and Publish IG

on:
  push:
    paths:
      - "ig/**"
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Runs on every branch: validates that FSH compiles cleanly.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Compile FSH
        working-directory: ig
        run: sushi .

  # Runs on main only: full IG Publisher build + Pages deployment.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Compile FSH
        working-directory: ig
        run: sushi .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: gem install jekyll bundler

      - name: Download IG Publisher
        run: |
          mkdir -p ig/input-cache
          curl -L -o ig/input-cache/publisher.jar \
            "https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar"

      - name: Run IG Publisher
        working-directory: ig
        run: java -jar input-cache/publisher.jar -ig ig.ini

      - name: Translate IG output to Swedish
        run: |
          find ig/output -name "*.html" -print0 | xargs -0 sed -i \
            -e 's|Artifact Index|Artefakter|g' \
            -e 's|<title>Artifact Index|<title>Artefakter|g' \
            -e 's|>Structures: |>Strukturer: |g' \
            -e 's|>Terminology: |>Terminologi: |g' \
            -e 's|>Behavior: |>Beteende: |g' \
            -e 's|>Profiles<|>Profiler<|g' \
            -e 's|>Extensions<|>Extensions<|g' \
            -e 's|>Logical Models<|>Logiska modeller<|g' \
            -e 's|>Code Systems<|>Kodsystem<|g' \
            -e 's|>Value Sets<|>Värdemängder<|g' \
            -e 's|>Concept Maps<|>Begreppsmappningar<|g' \
            -e 's|>Naming Systems<|>Namngivningssystem<|g' \
            -e 's|>Examples<|>Exempel<|g' \
            -e 's|>Downloads<|>Nedladdningar<|g' \
            -e 's|>Architecture<|>Arkitektur<|g' \
            -e 's|>Home<|>Hem<|g'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ig/output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
