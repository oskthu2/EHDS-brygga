name: Build and Publish IG

on:
  push:
    paths:
      - "ig/**"
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Runs on every branch: validates that FSH compiles cleanly.
  sushi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Compile FSH
        working-directory: ig
        run: sushi .

  # Runs on main only: full IG Publisher build + Pages deployment.
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Compile FSH
        working-directory: ig
        run: sushi .

      - name: Set up Java (for IG Publisher)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download IG Publisher
        run: |
          mkdir -p ig/input-cache
          curl -L -o ig/input-cache/publisher.jar \
            "https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar"

      - name: Run IG Publisher
        working-directory: ig
        run: java -jar input-cache/publisher.jar -ig ig.ini

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ig/output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
