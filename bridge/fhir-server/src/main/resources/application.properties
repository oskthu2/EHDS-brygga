server.port=8080
spring.application.name=ehds-brygga

# External service URLs – overridden by Docker env vars
ehds.sparr-url=http://mock-sparr:4003
ehds.audit-fhir-url=http://audit-db:4004/fhir

# Bridge identity
ehds.bridge-hsa-id=SE2321000999-EHDS

# Auth server base URL (used in CapabilityStatement SMART security extensions)
ehds.auth-base-url=http://localhost:8080

# Disable Spring Boot's default error page (HAPI handles FHIR errors)
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Logging
logging.level.se.inera.ehds=INFO
logging.level.org.apache.cxf=WARN
