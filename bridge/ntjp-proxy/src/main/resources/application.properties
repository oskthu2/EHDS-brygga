server.port=8091
spring.application.name=ntjp-proxy

# Katalogtjänster (T1/F1) och åtkomstintygsutfärdare – överskrivs av Docker-miljövariabler.
# Namngivning och flöde följer Ineras "T2-katalogtjänster"-demomiljö: bryggan slår själv
# upp producentens fysiska adress (T1) och verifierar federationsmedlemskap (F1) innan
# den hämtar ett åtkomstintyg och anropar den uppslagna adressen.
ntjp.tjanstekatalog-url=http://mock-tjanstekatalog:4001
ntjp.fedkatalog-url=http://mock-fedkatalog:4006
ntjp.token-issuer-url=http://mock-token-issuer:4007
ntjp.token-client-id=ehds-brygga
ntjp.token-client-secret=mock-secret
ntjp.org-identifier-system=urn:oid:1.2.752.29.4.19
ntjp.bridge-hsa-id=SE2321000999-EHDS
ntjp.audit-fhir-url=http://audit-db:8080/fhir

logging.level.se.inera.ehds=INFO
logging.level.org.apache.cxf=WARN
