services:
  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    depends_on:
      - bridge
    networks:
      - ehds-net

  bridge:
    build:
      context: ./bridge
      args:
        MODULE: fhir-server
    networks:
      - ehds-net
    environment:
      - EHDS_SPARR_URL=http://mock-sparr:4003
      - EHDS_EI_URL=http://mock-ei:4002
      - EHDS_AUDIT_FHIR_URL=http://audit-db:8080/fhir
      - EHDS_BRIDGE_HSA_ID=SE2321000999-EHDS
      - EHDS_AUTH_BASE_URL=http://localhost:8080
    depends_on:
      - ntjp-proxy
      - mock-sparr
      - mock-ei
      - audit-db

  ntjp-proxy:
    build:
      context: ./bridge
      args:
        MODULE: ntjp-proxy
    networks:
      - ehds-net
    environment:
      - NTJP_TJANSTEKATALOG_URL=http://mock-tjanstekatalog:4001
      - NTJP_FEDKATALOG_URL=http://mock-fedkatalog:4006
      - NTJP_TOKEN_ISSUER_URL=http://mock-token-issuer:4007
      - NTJP_BRIDGE_HSA_ID=SE2321000999-EHDS
      - NTJP_AUDIT_FHIR_URL=http://audit-db:8080/fhir
    depends_on:
      - mock-tjanstekatalog
      - mock-fedkatalog
      - mock-token-issuer
      - mock-backend

  mock-tjanstekatalog:
    build: ./mocks/tjanstekatalog
    networks:
      - ehds-net
    environment:
      - PORT=4001
      - BACKEND_URL=http://mock-backend:4005

  mock-fedkatalog:
    build: ./mocks/fedkatalog
    networks:
      - ehds-net
    environment:
      - PORT=4006

  mock-token-issuer:
    build: ./mocks/token-issuer
    networks:
      - ehds-net
    environment:
      - PORT=4007

  mock-sparr:
    build: ./mocks/sparr
    networks:
      - ehds-net
    environment:
      - PORT=4003

  mock-ei:
    build: ./mocks/ei
    networks:
      - ehds-net
    environment:
      - PORT=4002

  audit-db:
    image: hapiproject/hapi:latest
    networks:
      - ehds-net
    ports:
      - "4004:8080"

  mock-backend:
    build: ./mocks/backend
    networks:
      - ehds-net
    environment:
      - PORT=4005

networks:
  ehds-net:
    driver: bridge
