services:
  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    depends_on:
      - bridge
    networks:
      - ehds-net

  bridge:
    build:
      context: ./bridge
      args:
        MODULE: fhir-server
    networks:
      - ehds-net
    environment:
      - EHDS_EI_URL=http://mock-ei:4002
      - EHDS_SPARR_URL=http://mock-sparr:4003
      - EHDS_LOGG_URL=http://mock-logg:4004
      - EHDS_BRIDGE_HSA_ID=SE2321000999-EHDS
      - EHDS_AUTH_BASE_URL=http://localhost:8080
    depends_on:
      - ntjp-proxy
      - mock-ei
      - mock-sparr
      - mock-logg

  ntjp-proxy:
    build:
      context: ./bridge
      args:
        MODULE: ntjp-proxy
    networks:
      - ehds-net
    environment:
      - NTJP_TAK_URL=http://mock-tak:4001
      - NTJP_BRIDGE_HSA_ID=SE2321000999-EHDS
    depends_on:
      - mock-tak
      - mock-backend

  mock-tak:
    build: ./mocks/tak
    networks:
      - ehds-net
    environment:
      - PORT=4001
      - BACKEND_URL=http://mock-backend:4005
      - BRIDGE_HSA_ID=SE2321000999-EHDS

  mock-ei:
    build: ./mocks/ei
    networks:
      - ehds-net
    environment:
      - PORT=4002

  mock-sparr:
    build: ./mocks/sparr
    networks:
      - ehds-net
    environment:
      - PORT=4003

  mock-logg:
    build: ./mocks/logg
    networks:
      - ehds-net
    environment:
      - PORT=4004

  mock-backend:
    build: ./mocks/backend
    networks:
      - ehds-net
    environment:
      - PORT=4005

networks:
  ehds-net:
    driver: bridge
