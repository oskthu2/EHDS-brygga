events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    upstream bridge {
        server bridge:8080;
    }

    server {
        listen 80;
        server_name _;

        # Well-known FHIR/SMART endpoints – served directly by gateway
        location /.well-known/ {
            root /usr/share/nginx/html;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }

        # VG-scopad FHIR API: /fhir/{vgHsaId}/{resurs}?...
        # HSA-id:ar börjar alltid med SE – säker diskriminator mot FHIR-resurser
        location ~ ^/fhir/(SE[^/]+)/(.+)$ {
            set $vg_hsa_id $1;
            proxy_pass http://bridge/$2$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-VG-HSA-ID $vg_hsa_id;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            if ($request_method = OPTIONS) { return 204; }
        }

        # Oscopat FHIR API: /fhir/metadata, /fhir/Condition (aggregerar alla VG:ar)
        location /fhir/ {
            proxy_pass http://bridge/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;

            # CORS
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Health check
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
